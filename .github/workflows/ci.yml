# Every push and pull request: lint, types, tests, a build, and the
# end-to-end walk-through (including the accessibility audits and the
# real watch flow against a local server).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:offline
      - run: npm test
      - run: npm run build
      - name: Install Playwright (only for the e2e walk-through)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/shots/
